name: Publish Dev to PyPI

on:
  push:
    branches: [ dev ]
  workflow_dispatch:  # Erlaubt manuelles Triggern

jobs:
  publish-dev:
    name: Build and publish dev version to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Volle Historie für Commit-Count
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Generate dev version
      id: version
      run: |
        BASE_VERSION="2.0.0"
        COMMIT_COUNT=$(git rev-list --count HEAD)
        DEV_VERSION="${BASE_VERSION}.dev${COMMIT_COUNT}"
        echo "Dev version: ${DEV_VERSION}"
        echo "version=${DEV_VERSION}" >> $GITHUB_OUTPUT
        sed -i "s/version = .*/version = \"${DEV_VERSION}\"/" pyproject.toml
    
    - name: Show updated version
      run: |
        grep "^version" pyproject.toml
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
    
    - name: Create Git tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "v${{ steps.version.outputs.version }}" -m "Dev release ${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
